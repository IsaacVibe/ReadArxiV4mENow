<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/raven-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      {
        let theme = 'system';
        try {
          const saved = localStorage.getItem('raven-theme-mode');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch { /* Follow the system even when storage is unavailable. */ }
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      }
    </script>
    <title>Read ArxiV 4 mE Now (RAVEN)</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
